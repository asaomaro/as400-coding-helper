<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDS ビジュアルエディタ（単独起動）</title>
<link rel="stylesheet" href="./standalone.css">
</head>
<body>
<div id="shell">
  <!-- ホストが肩代わりしないもの（ファイル操作・undo）は、単独起動では自前で持つ。 -->
  <div id="hostbar">
    <strong>単独起動モード</strong>
    <select id="sample"></select>
    <label class="file">ファイルを開く<input type="file" id="open" accept=".dspf,.mnudds,.dds,text/plain"></label>
    <button type="button" id="undo">元に戻す</button>
    <button type="button" id="save">保存（ダウンロード）</button>
    <span class="spacer"></span>
    <span id="byteState"></span>
  </div>
  <div id="panes">
    <div id="editor"></div>
    <div id="sourcePane">
      <div class="head">対応するソース <span id="sourceName"></span></div>
      <div id="source"></div>
    </div>
  </div>
  <dialog id="ask">
    <form method="dialog">
      <p id="ask-title"></p>
      <label>名前 <input id="ask-name" maxlength="10" value="FLD1"></label>
      <label>長さ <input id="ask-length" value="10"></label>
      <label>文字列 <input id="ask-text" value="TEXT"></label>
      <menu>
        <button value="cancel">取り消し</button>
        <button value="ok" id="ask-ok">置く</button>
      </menu>
    </form>
  </dialog>
</div>
<script src="./standalone.js"></script>
</body>
</html>
