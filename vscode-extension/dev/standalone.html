<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDS ビジュアルエディタ（単独起動・検証用）</title>
<link rel="stylesheet" href="./standalone.css">
</head>
<body>
<div id="shell">
  <!-- ホストが肩代わりしない部品は、スタンドアロンでは自前で持つ（design DD8）。
       この帯がその「自前で持つ」部分＝ファイル操作と undo にあたる。 -->
  <div id="hostbar">
    <strong>単独起動モード</strong>
    <select id="sample"></select>
    <label class="file">ファイルを開く<input type="file" id="open" accept=".dspf,.dds,.prtf,text/plain"></label>
    <button type="button" id="undo">元に戻す</button>
    <button type="button" id="save">保存（ダウンロード）</button>
    <span class="spacer"></span>
    <span id="byteState"></span>
  </div>
  <div id="panes">
    <div id="editor"></div>
    <div id="sourcePane">
      <div class="head">対応するソース <span id="sourceName"></span></div>
      <div id="source"></div>
    </div>
  </div>
</div>
<script src="./standalone.js"></script>
</body>
</html>
