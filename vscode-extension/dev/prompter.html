<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F4 プロンプター（単独起動）</title>
<link rel="stylesheet" href="./prompter.css">
</head>
<body>
<div id="shell">
  <!-- ホストが肩代わりするもの（定義の読み込み・入れ子の窓・書き戻し）は、
       単独起動ではこの帯が持つ。**これが VSCode 版との差の全部。** -->
  <div id="hostbar">
    <strong>単独起動モード</strong>
    <select id="sample"></select>
    <span class="spacer"></span>
    <span id="outcome"></span>
  </div>
  <div id="panes">
    <div id="root"></div>
    <div id="resultPane">
      <div class="head">確定すると書き戻される行</div>
      <pre id="result"></pre>
      <div class="head">確定した値</div>
      <pre id="values"></pre>
    </div>
  </div>
  <!-- 入れ子のプロンプター（F4 in F4）。**同じ UI をもう 1 枚開くだけ。** -->
  <div id="nested" class="nested hidden">
    <div class="nested-backdrop"></div>
    <div class="nested-panel">
      <div class="nested-head">入れ子のプロンプター（<span id="nested-keyword"></span>）</div>
      <div id="nested-root"></div>
    </div>
  </div>
</div>
<script src="./prompter.js"></script>
</body>
</html>
