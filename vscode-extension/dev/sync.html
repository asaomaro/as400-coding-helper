<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一括の送受信（単独起動）</title>
<link rel="stylesheet" href="./sync.css">
<style>
  #hostbar { padding: 6px 16px; background: #f0f0f0; font: 13px sans-serif; }
  #log { margin: 0 16px; font: 12px monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<!-- ホストが肩代わりするもの（IBM i・フォルダ・確認・差分）は、単独起動ではこの帯と #log が持つ。 -->
<div id="hostbar"><strong>単独起動モード</strong>（IBM i とフォルダは埋め込みの見本）</div>
<div id="root"></div>
<pre id="log"></pre>
<script src="./sync.js"></script>
</body>
</html>
