# aidev のPJ単位設定（ハーネスが参照する。PJ非依存ハーネスに対する PJ 側の設定）。
# 外部チケット連携の「種類」はここに1回だけ置き、各 works の state.yml には ticket の ID だけを持たせる（DRY）。

tracker:
  type: github        # github | jira | redmine | none（none＝外部連携なし・backlog/ローカル完結）
  # baseUrl:          # 任意。チケットURLの組み立てに使う（例 https://your.atlassian.net/browse/）

# VS Code 拡張のビルド成果物が CLI として起動することを確認する。同期機能は command
# の追加であり、新しい終了型 CLI を持たないため、既存 DDS CLI の parse/lint を用いる。
smokeCommands:
  - node vscode-extension/out/cli/dds.js parse vscode-extension/test/golden/RENDER1.dspf && node vscode-extension/out/cli/lint.js vscode-extension/test/golden/RENDER1.dspf
