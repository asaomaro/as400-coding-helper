<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>11. 道具箱の中の枡目（差し金あり）</title>
  <rect width="128" height="128" rx="24" fill="#243447"/>
  <!-- 差し金: 箱の中から斜めに突き出す -->
  <g transform="rotate(-24 64 64)">
    <path d="M42 8h11v54h30v11H42z" fill="#E3B341"/>
    <g stroke="#8A6A1C" stroke-width="2">
      <path d="M53 16h-5M53 24h-8M53 32h-5M53 40h-8M53 48h-5"/>
      <path d="M61 62v-5M69 62v-8M77 62v-5"/>
    </g>
  </g>
  <!-- 道具箱 -->
  <rect x="12" y="48" width="104" height="66" rx="7" fill="#C8894B"/>
  <rect x="12" y="46" width="104" height="11" rx="4" fill="#A86F38"/>
  <!-- 正面の枡目（1 マス = 1 桁） -->
  <rect x="22" y="62" width="84" height="44" rx="3" fill="#0F1D15"/>
  <g stroke="#23533A" stroke-width="1.5" fill="none">
    <path d="M22 76.7h84M22 91.3h84"/>
    <path d="M36 62v44M50 62v44M64 62v44M78 62v44M92 62v44"/>
  </g>
  <!-- { 全角 1 字（2 マス） } -->
  <rect x="51" y="79" width="26" height="10" rx="1.5" fill="#39D353"/>
  <g fill="none" stroke="#39D353" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 78c-3 0-3 2-3 3.5 0 1.5-1 2.5-3 2.5 2 0 3 1 3 2.5 0 1.5 0 3.5 3 3.5"/>
    <path d="M82 78c3 0 3 2 3 3.5 0 1.5 1 2.5 3 2.5-2 0-3 1-3 2.5 0 1.5 0 3.5-3 3.5"/>
  </g>
</svg>
