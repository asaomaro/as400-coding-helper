<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>16. 道具箱の緑の画面（道具 4 本）</title>
  <rect width="128" height="128" rx="24" fill="#243447"/>
  <!-- 差し金（左端） -->
  <g transform="rotate(-26 64 64)">
    <path d="M34 6h10v56h28v10H34z" fill="#E3B341"/>
    <g stroke="#8A6A1C" stroke-width="2">
      <path d="M44 14h-5M44 22h-7M44 30h-5M44 38h-7M44 46h-5"/>
    </g>
  </g>
  <!-- 赤鉛筆（中央左） -->
  <g transform="rotate(-6 54 32)">
    <rect x="49" y="22" width="10" height="32" fill="#D23B2A"/>
    <rect x="53" y="22" width="2" height="32" fill="#A82A1C"/>
    <path d="M49 22l5-10 5 10z" fill="#E8C49A"/>
    <path d="M52.3 15.5l1.7-3.5 1.7 3.5z" fill="#2B2F36"/>
