    <rect x="82" y="14" width="6" height="11" rx="2" fill="#7B8591"/>
  </g>
  <!-- 木の道具箱 -->
  <rect x="12" y="48" width="104" height="66" rx="7" fill="#C8894B"/>
  <rect x="12" y="46" width="104" height="11" rx="4" fill="#A86F38"/>
  <!-- 正面の 5250 の画面 -->
  <rect x="22" y="62" width="84" height="44" rx="3" fill="#07120A"/>
  <g fill="#39D353">
    <rect x="29" y="68" width="32" height="5" rx="1"/>
    <rect x="65" y="68" width="14" height="5" rx="1"/>
    <rect x="29" y="77" width="18" height="5" rx="1"/>
    <rect x="51" y="77" width="36" height="5" rx="1"/>
    <rect x="29" y="86" width="26" height="5" rx="1"/>
    <rect x="29" y="95" width="8" height="6"/>
