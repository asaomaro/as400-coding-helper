<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>9. 光る木箱</title>
  <defs>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="24" fill="#14161A"/>
  <!-- 箱の本体（左・右の面） -->
  <path d="M22 58l42 22v36L22 94z" fill="#B07A40"/>
  <path d="M106 58L64 80v36l42-22z" fill="#8A5A2B"/>
  <path d="M22 72l42 22M64 94l42-22" stroke="#6B4A2A" stroke-width="2" fill="none"/>
  <!-- 蓋と本体の隙間から漏れる光 -->
  <path d="M22 58l42 22 42-22" fill="none" stroke="#39D353" stroke-width="10" filter="url(#glow)"/>
  <path d="M22 58l42 22 42-22" fill="none" stroke="#A6F5B8" stroke-width="2.5"/>
  <!-- 少し浮いた蓋 -->
  <path d="M64 14l44 22-44 22-44-22z" fill="#D9A060"/>
  <path d="M20 36v6l44 22v-6zM108 36v6L64 64v-6z" fill="#A86F38"/>
  <path d="M42 25l44 22M86 25L42 47" stroke="#B98347" stroke-width="2"/>
</svg>
