name: prompter definitions

# プロンプター定義 JSON が原典（docs/origin）と一致していることを保証する。
#
# 定義 JSON は docs/origin/generate-cl-definitions.mjs が原典HTMLから決定的に生成する。
# 手で編集すると次の再生成で消えるうえ、原典との乖離に気づけないため、
#   1. 検証スクリプトで原典との差分ゼロを確認し、
#   2. 再生成しても差分が出ない（＝生成物が最新である）ことを確認する。
# あわせて拡張のビルドが通ることも見る。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 定義 JSON と原典の突き合わせ（CL 日本語 / 英語）
        run: |
          node docs/origin/verify-cl-definitions.mjs
          node docs/origin/verify-cl-definitions.mjs --lang=en

      - name: 定義 JSON と原典の突き合わせ（RPG 桁位置）
        run: node docs/origin/verify-rpg-definitions.mjs

      - name: DDS 桁定義の検査
        run: node docs/origin/verify-dds-columns.mjs

      - name: DDS キーワード補完データの検査
        run: node docs/origin/verify-dds-keywords.mjs

      - name: RPG 補完データの検査
        run: node docs/origin/verify-rpg-completion.mjs

      - name: RPG III 命令コードの検査
        run: node docs/origin/verify-rpg3-completion.mjs

      - name: DDS プロンプター定義の検査
        run: node docs/origin/verify-dds-prompter.mjs

      - name: RPG 仕様書定義（英語版）の検査
        run: node docs/origin/verify-rpg-spec-definitions.mjs

      - name: 再生成しても差分が出ないこと
        run: |
          node docs/origin/generate-cl-definitions.mjs
          node docs/origin/generate-cl-definitions.mjs --lang=en
          # CDML(実機の *CMD) 由来の相関規則・属性を載せる。これを飛ばすと
          # dependencies / promptControl / valueMap が消えた JSON が生成され、
          # 「差分が出ないこと」が常に失敗する（PR#95 以降ここが抜けていた）。
          node docs/origin/generate-cdml-rules.mjs
          node docs/origin/generate-dds-columns.mjs
          # 英語版の桁・ラベル（20260829-dds-en-labels）。忘れると en の生成物が
          # 再生成されず、ドリフトが検出されない。
          node docs/origin/generate-dds-columns.mjs --lang=en
          node docs/origin/generate-dds-keywords.mjs
          node docs/origin/generate-dds-keyword-syntax.mjs
          node docs/origin/generate-dds-keywords.mjs --lang=en
          node docs/origin/generate-dds-keyword-syntax.mjs --lang=en
          # **キーワード表が出来上がってから**にする。`generate-dds-keyword-syntax`
          # が詳細ページから `level` を足すので、その前に走らせると 5 件足りない
          # 表になる（PR #130 の CI で実際に落ちた）。
          node docs/origin/generate-dds-keyword-levels.mjs
          node docs/origin/generate-rpg-completion.mjs
          node docs/origin/generate-rpg-completion.mjs --lang=en
          node docs/origin/generate-rpg3-completion.mjs
          node docs/origin/generate-rpg3-completion.mjs --lang=en
          node docs/origin/generate-seu-format-lines.mjs
          node docs/origin/generate-dds-prompter.mjs
          node docs/origin/generate-dds-prompter.mjs --lang=en
          node docs/origin/generate-rpg-spec-definitions.mjs
          # I/O 仕様書の 8 定義（レコード識別 / フィールド × プログラム記述 / 外部記述）。
          # 一度も CI で回っていなかった。
          node docs/origin/generate-rpg-io-definitions.mjs
          # **対象を列挙しない。** 以前は prompter/cl・navigation・completion の 3 つを
          # 並べており、出力先が増えたときに足し忘れても何も起きなかった。実際
          # prompter/dds・prompter/cmd・prompter/rpg の 3 つが漏れていて、
          # **DDS の定義 JSON は手で直しても CI が気付かない**状態だった。
          # resources 全体を見れば、生成器が増えても同期漏れが起きない。
          if ! git diff --quiet -- vscode-extension/resources; then
            echo "::error::定義 JSON が生成結果と一致しません。"
            echo "::error::JSON を手で直さず、生成スクリプトを直して再生成してください。"
            git diff --stat -- vscode-extension/resources
            exit 1
          fi

      - name: 拡張のビルドと検証（定義の構造 / CL 往復 / lint core の境界）
        working-directory: vscode-extension
        run: |
          npm ci || npm install
          npm run verify

      # lint コマンドは vscode を必要としないので、素の node で回せる。
      # 正しいソースなので指摘が出たら偽陽性であり、そこで落とす。
      #
      # **SLSENT01 / EMPMNT01 / RPG3SAMP も対象に入れた**（2026-08-28）。
      # 以前は「桁ずれの疑いがある」として外していたが、実機に判定させたところ
      # **サンプルの方が誤り**だった（D 仕様書の長さ欄が 33-39 桁に収まっておらず
      # 7 桁ぶん左。`CRTBNDRPG` が通さない）。サンプルを直し、あわせて
      # 拡張演算項目 2 の命令の集合を原典から採るようにした（`DOU` が抜けており、
      # 正しい行に偽陽性を出していた）。
      - name: 桁位置 lint（サンプルで指摘ゼロ）
        run: |
          node vscode-extension/out/cli/lint.js --format text --fail-on warning \
            docs/src/CUSTMST.pf \
            docs/src/CUSTLF1.lf \
            docs/src/CUSTMNT.dspf \
            docs/src/CUSTRPT.prtf \
            docs/src/DBCSSAMP.pf \
            docs/src/IOSAMP.rpgle \
            docs/src/EMPMNT01.rpgle \
            docs/src/SLSENT01.rpgle \
            docs/src/RPG3SAMP.rpg

      # ユニットテストは依存（mocha / 型定義）が要るので、依存を入れる
      # このジョブで走らせる。verify ジョブは素の node で原典照合をするだけ。
      - name: ユニットテスト
        working-directory: vscode-extension
        run: npm test

  # ---------------------------------------------------------------------------
  # 統合テスト（VSCode の拡張ホストの中で走らせる）
  #
  # WebView の中は GUI e2e が見るが、**VSCode の器**（コマンドの登録・
  # `WorkspaceEdit`・カスタムエディタ）は拡張ホストの中でしか確かめられない。
  #
  # **長く動かない状態だった。** `vscode-test` が依存に入っておらず、
  # `test/suite/index.ts` は `bdd` で `suite` / `test` を拾えず、対象も
  # 1 つ上（＝単体テストまで）を見ていた。F4 のテストは
  # 「利用者が送信／取消するまで解決しない Promise」を `await` しており、
  # **拡張ホストごと落ちてスイート全体が止まっていた**。
  #
  # 器（Electron）を動かすには表示装置が要るので `xvfb-run` で包む。
  # verify / gui-e2e とは別ジョブにして並行に走らせる。
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 表示装置（Electron を動かすのに要る）
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 依存
        working-directory: vscode-extension
        run: npm ci || npm install

      # **落ちたら止まる。** `continue-on-error` は付けない。
      - name: 統合テスト
        working-directory: vscode-extension
        run: xvfb-run -a npm run test:integration

  # ---------------------------------------------------------------------------
  # GUI e2e（単独起動ハーネスを実際に操作する）
  #
  # WebView の中は拡張ホストから触れず、単体テストは `buildInitialState()` までしか
  # 見ない。**掴んで動かす・つまみで伸ばす・チップを外す・標識を倒す**が実際に効くかは、
  # ここでしか落ちない（`moveColumn` が `parseEdit` に無くホストが黙って捨てていた件は、
  # 型検査も単体テストも通っていた）。
  #
  # **不安定なまま載せない。** 載せる前に手元で 10 回連続回して緑を確認した
  # （2026-08-27・109 件・1 回 25 秒。記録は
  # `.aidev/works/20260827-dds-e2e-on-ci/verify/stability-2026-08-27.txt`）。
  # 不安定なテストを混ぜると**赤を無視する習慣**がつき、CI 全体が効かなくなる。
  # したがって `continue-on-error` は付けない——落ちたら止まる。
  #
  # verify ジョブとは別にして並行に走らせる。ブラウザの用意（1 分ほど）を
  # 原典照合の前に挟まないため、そしてブラウザ回りの失敗が原典照合の失敗を
  # 隠さないため。
  gui-e2e:
    runs-on: ubuntu-latest
    env:
      # **キャッシュの鍵。** 浮動にすると毎回キャッシュが外れてブラウザを取り直す。
      # 上げるときはここだけを変える（`playwright-core` は依存に入れない——
      # CI 以外では要らず、`npm ci` を重くするだけなので）。
      PLAYWRIGHT_VERSION: "1.62.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: 依存とブラウザ
        working-directory: vscode-extension
        run: |
          npm ci || npm install
          npm install --no-save "playwright-core@${PLAYWRIGHT_VERSION}"
          # --with-deps は sudo を要求して遅い。ubuntu-latest には必要な共有ライブラリが
          # 入っており、起動は --no-sandbox --disable-gpu なので付けなくてよい。
          node node_modules/playwright-core/cli.js install chromium

      - name: WebView を束ねる
        working-directory: vscode-extension
        run: npm run compile:webview

      # 前提が足りないときは終了コード 2 で落ちる（ブラウザが無い / ページが無い）。
      # **skip にしない**——「走らなかった」を「通った」と読み違えないため。
      #
      # 2 本を別ステップにするのは、片方が落ちても**もう片方の結果を見たい**から
      # （`npm run dev:e2e` は `&&` で繋いでおり、手元で 1 発で回すためのもの）。
      - name: GUI e2e（DDS ビジュアルエディタ）
        working-directory: vscode-extension
        run: node dev/e2e.mjs

      - name: GUI e2e（F4 プロンプター）
        # 前のステップが落ちても走らせる。どちらが壊れたのかを 1 回の実行で見る。
        if: always()
        working-directory: vscode-extension
        run: node dev/prompter-e2e.mjs
